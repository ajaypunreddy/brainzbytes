<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b08">
<title>BrainzBytes × ContextWeaver company overview</title>
<style>
:root{--bg:#050b08;--panel:#07110d;--surface:#0d1912;--line:#244a2d;--muted:#91a298;--ink:#f4fff5;--lime:#7cff8f;--amber:#efb84f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 12% 0,#17331f 0,transparent 32%),var(--bg)}
button{font:inherit}.player{width:min(1240px,100%);border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--panel);box-shadow:0 24px 80px #0009}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 16px;border-bottom:1px solid var(--line);background:#07110df2}
.brands{display:flex;align-items:center;gap:10px;min-width:0}.brands img{width:32px;height:32px}.brands span{display:grid;line-height:1.05}.brands strong{font-size:12px}.brands small{color:var(--muted);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.stage-count{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.canvas{position:relative;aspect-ratio:16/9;background:#03100a;overflow:hidden}.canvas>img{display:block;width:100%;height:100%;object-fit:contain}
.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.focus{fill:#7cff8f0c;stroke:var(--lime);stroke-width:4;vector-effect:non-scaling-stroke;filter:url(#glow)}.route{fill:none;stroke:var(--lime);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:12 10;filter:url(#glow);animation:flow 1.1s linear infinite}.pulse{fill:var(--lime);filter:url(#glow);animation:pulse 1.2s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-44}}@keyframes pulse{50%{opacity:.35;transform:scale(.9)}}
.audio-gate{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#050b0812,#050b08b8);transition:opacity .2s}.audio-gate[hidden]{display:none}.audio-gate button{display:grid;place-items:center;gap:4px;min-width:190px;min-height:66px;padding:12px 18px;border:1px solid var(--lime);border-radius:12px;background:#102c1d;color:var(--ink);font-weight:850;cursor:pointer;box-shadow:0 16px 50px #0009}.audio-gate small{color:#b8cabd;font-size:10px;font-weight:650}
.caption{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;min-height:104px;padding:15px 18px;border-top:1px solid var(--line);background:linear-gradient(135deg,#0d1912,#07110d)}.caption-copy{min-width:0}.caption-label{margin:0 0 5px;color:var(--lime);font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.caption h1{margin:0;color:var(--ink);font-size:clamp(16px,2vw,24px);letter-spacing:-.025em}.caption p:last-child{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
.controls{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}.controls button{min-height:34px;padding:0 10px;border:1px solid #315b3b;border-radius:8px;background:#0c1810;color:#cfe0d2;font-size:10px;font-weight:800;cursor:pointer}.controls button:hover,.controls button:focus-visible,.controls button[aria-pressed=true]{border-color:var(--lime);color:var(--ink);background:#16331f;outline:none}.controls .primary{border-color:var(--lime);background:var(--lime);color:#061008}.controls button:focus-visible,.audio-gate button:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.progress{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:0 18px 14px;background:#07110d}.progress button{height:4px;padding:0;border:0;border-radius:99px;background:#244a2d;cursor:pointer}.progress button.active{background:var(--lime);box-shadow:0 0 12px #7cff8f88}
body.embedded{padding:0;background:var(--bg)}body.embedded .player{width:100%;border:0;border-radius:0;box-shadow:none}body.embedded .topbar{padding-block:8px}body.embedded .canvas{max-height:64vh}body.popout{padding:24px}
@media(max-width:760px){.topbar{align-items:flex-start}.stage-count{display:none}.caption{grid-template-columns:1fr;min-height:0}.controls{justify-content:flex-start}.controls button{flex:1 1 auto}.caption p:last-child{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="player" aria-label="Narrated BrainzBytes and ContextWeaver company overview">
  <header class="topbar">
    <div class="brands"><img src="brainzbytes-b4.svg" alt=""><img src="contextweaver-c1.svg" alt=""><span><strong>BrainzBytes × ContextWeaver</strong><small>Company overview</small></span></div>
    <span class="stage-count" id="stageCount">01 / 10</span>
  </header>
  <section class="canvas">
    <img src="contextweaver-weaving.png" alt="ContextWeaver architecture showing intent and Studio composition feeding an orchestrator, event mesh, live services, governed data plane, and evidence loop">
    <svg class="overlay" viewBox="0 0 1200 675" aria-hidden="true">
      <defs><filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <g id="focusLayer"></g><g id="routeLayer"></g>
    </svg>
    <div class="audio-gate" id="audioGate"><button type="button" id="beginStory">Begin the audio story<small>Original jazz + narrated overview</small></button></div>
  </section>
  <section class="caption" aria-live="polite">
    <div class="caption-copy"><p class="caption-label" id="stageLabel"></p><h1 id="stageTitle"></h1><p id="stageCaption"></p></div>
    <div class="controls" aria-label="Playback controls">
      <button type="button" id="previous" aria-label="Previous stage">Previous</button>
      <button type="button" id="playPause" class="primary" aria-label="Pause overview">Pause</button>
      <button type="button" id="next" aria-label="Next stage">Next</button>
      <button type="button" id="reset" aria-label="Reset overview">Reset</button>
      <button type="button" id="music" aria-pressed="true" aria-label="Mute jazz music">Music on</button>
      <button type="button" id="narration" aria-pressed="true" aria-label="Disable narration">Narration on</button>
      <button type="button" id="popout" aria-label="Open overview in a dedicated window">Pop out</button>
    </div>
  </section>
  <nav class="progress" id="progress" aria-label="Overview stages"></nav>
  <audio id="jazz" src="brainzbytes-jazz-loop.wav" loop preload="auto"></audio>
</main>
<script>
const stages=[{"label":"BrainzBytes mission","title":"Build intelligent systems that can earn enterprise trust.","caption":"BrainzBytes creates AI operating systems that combine reasoning, reusable capabilities, governance, and durable execution.","narration":"BrainzBytes builds intelligent systems that can earn enterprise trust. The goal is not another chatbot. It is governed artificial intelligence that can safely perform real work.","hotspots":[[45,28,570,105]],"routes":[]},{"label":"ContextWeaver","title":"ContextWeaver turns approved intent into operating systems.","caption":"The product composes MCP tools, Agents, knowledge, workflows, and services while keeping policy and evidence attached.","narration":"ContextWeaver is the product. It turns approved intent into operating systems by composing MCP tools, agents, knowledge, workflows, and services, with policy and evidence attached.","hotspots":[[50,202,220,84],[324,253,257,101]],"routes":["M266 244H298V302H329"]},{"label":"Governed intent","title":"Every run begins with an explicit goal and constraints.","caption":"Identity, secrets, policy, guardrails, and governance define who may act, what may happen, and which evidence is required.","narration":"Every run begins with an explicit goal and constraints. Identity, secrets, policy, guardrails, and governance define who may act, what may happen, and which evidence must be produced.","hotspots":[[54,207,212,73],[54,136,536,36]],"routes":["M266 244H298V302H329"]},{"label":"Studio composition","title":"Builders compose capabilities instead of rebuilding platforms.","caption":"Agent and MCP Studio combines approved models, tools, knowledge, APIs, and services into reusable governed components.","narration":"In the Studio, builders compose approved models, tools, knowledge, APIs, and services. Teams reuse governed capabilities instead of rebuilding the platform for every use case.","hotspots":[[54,307,212,75],[324,253,257,101]],"routes":["M266 344H329"]},{"label":"Cerebros","title":"Cerebros provides the reasoning brain.","caption":"It interprets intent, retrieves context, plans bounded work, and reconciles outcomes without granting itself authority.","narration":"Cerebros is the reasoning brain. It interprets intent, retrieves the right context, plans bounded work, and reconciles outcomes, without ever granting itself authority.","hotspots":[[324,253,257,101],[54,456,816,68]],"routes":["M452 354V456"]},{"label":"Loom","title":"Loom is the portable architectural foundation.","caption":"The event mesh and governed data plane carry commands, context, state, artifacts, and credentials across cloud-neutral runtime boundaries.","narration":"Loom is the portable architectural foundation. Its event mesh and governed data plane carry commands, context, state, artifacts, and credentials across cloud neutral runtime boundaries.","hotspots":[[638,207,212,76],[54,456,816,68]],"routes":["M575 303H607V245H638","M452 354V456"]},{"label":"Weave","title":"Weave orchestrates work across MCPs, Agents, Workflows, and APIs.","caption":"It routes commands, coordinates parallel and durable steps, applies retries, and preserves the governed execution context.","narration":"Weave is the orchestration fabric. It routes commands across MCPs, agents, workflows, and APIs, coordinates durable steps and retries, and preserves the governed execution context.","hotspots":[[638,207,212,226]],"routes":["M744 283V312","M744 283V432","M819 283V312","M819 283V432"]},{"label":"Live services","title":"Approved compositions become scalable live services.","caption":"ContextWeaver deploys, scales, replaces, and observes reusable AI services without detaching their policy or provenance.","narration":"Approved compositions become scalable live services. ContextWeaver deploys, scales, replaces, and observes reusable artificial intelligence services without detaching policy or provenance.","hotspots":[[911,253,236,101]],"routes":["M850 245H882V303H912"]},{"label":"Evidence loop","title":"Every material action returns evidence.","caption":"Traces, receipts, evaluations, audits, and improvement signals make outcomes reviewable, explainable, and continuously governable.","narration":"Every material action returns evidence. Traces, receipts, evaluations, audits, and improvement signals make outcomes reviewable, explainable, and continuously governable.","hotspots":[[911,376,236,148]],"routes":["M1028 377V364H1059V349"]},{"label":"Enterprise outcome","title":"BrainzBytes makes governed AI reusable from design through production.","caption":"ContextWeaver, Loom, Cerebros, and Weave unite architecture, intelligence, orchestration, governance, and evidence in one operating model.","narration":"Together, ContextWeaver, Loom, Cerebros, and Weave unite architecture, intelligence, orchestration, governance, and evidence in one operating model, from design through production.","hotspots":[[45,202,1102,322]],"routes":["M266 244H298V302H329","M575 303H607V245H638","M850 245H882V303H912","M1028 377V364H1059V349"]}];
const params=new URLSearchParams(location.search);
const embedded=params.get('embedded')==='1';
const popout=params.get('popout')==='1';
document.body.classList.toggle('embedded',embedded);
document.body.classList.toggle('popout',popout);
const byId=id=>document.getElementById(id);
const focusLayer=byId('focusLayer'),routeLayer=byId('routeLayer'),jazz=byId('jazz');
let index=0,playing=true,musicEnabled=true,narrationEnabled=true,audioStarted=false,timer=0;
jazz.volume=.2;
const progress=byId('progress');
stages.forEach((stage,stageIndex)=>{const button=document.createElement('button');button.type='button';button.ariaLabel=`Open stage ${stageIndex+1}: ${stage.label}`;button.addEventListener('click',()=>{index=stageIndex;render(true)});progress.append(button)});
function svg(name,attributes){const node=document.createElementNS('http://www.w3.org/2000/svg',name);Object.entries(attributes).forEach(([key,value])=>node.setAttribute(key,value));return node}
function speak(stage){speechSynthesis.cancel();if(!audioStarted||!narrationEnabled)return;const utterance=new SpeechSynthesisUtterance(stage.narration);utterance.rate=.96;utterance.pitch=.94;utterance.volume=1;utterance.onstart=()=>{jazz.volume=musicEnabled ? .07 : 0};utterance.onend=utterance.onerror=()=>{jazz.volume=musicEnabled ? .2 : 0};speechSynthesis.speak(utterance)}
function schedule(){clearTimeout(timer);if(playing)timer=setTimeout(()=>{index=(index+1)%stages.length;render(true)},7600)}
function render(announce=false){
  const stage=stages[index];focusLayer.replaceChildren();routeLayer.replaceChildren();
  stage.hotspots.forEach(([x,y,width,height])=>focusLayer.append(svg('rect',{x,y,width,height,rx:18,class:'focus'})));
  stage.routes.forEach(d=>{const path=svg('path',{d,class:'route'});routeLayer.append(path);const point=path.getPointAtLength(path.getTotalLength());routeLayer.append(svg('circle',{cx:point.x,cy:point.y,r:8,class:'pulse'}))});
  byId('stageLabel').textContent=`${String(index+1).padStart(2,'0')} · ${stage.label}`;
  byId('stageTitle').textContent=stage.title;byId('stageCaption').textContent=stage.caption;byId('stageCount').textContent=`${String(index+1).padStart(2,'0')} / ${stages.length}`;
  [...progress.children].forEach((button,buttonIndex)=>button.classList.toggle('active',buttonIndex===index));
  byId('playPause').textContent=playing?'Pause':'Play';byId('playPause').ariaLabel=playing?'Pause overview':'Play overview';
  if(announce)speak(stage);schedule();
}
async function beginAudio(){
  audioStarted=true;byId('audioGate').hidden=true;
  if(musicEnabled){try{await jazz.play()}catch{musicEnabled=false;byId('music').ariaPressed='false';byId('music').textContent='Music off'}}
  speak(stages[index]);
}
byId('beginStory').addEventListener('click',beginAudio);
byId('playPause').addEventListener('click',()=>{playing=!playing;if(!playing)speechSynthesis.cancel();else if(audioStarted)speak(stages[index]);render()});
byId('previous').addEventListener('click',()=>{index=(index-1+stages.length)%stages.length;render(true)});
byId('next').addEventListener('click',()=>{index=(index+1)%stages.length;render(true)});
byId('reset').addEventListener('click',()=>{index=0;playing=false;speechSynthesis.cancel();jazz.currentTime=0;render()});
byId('music').addEventListener('click',async()=>{musicEnabled=!musicEnabled;byId('music').ariaPressed=String(musicEnabled);byId('music').textContent=musicEnabled?'Music on':'Music off';if(musicEnabled){audioStarted=true;byId('audioGate').hidden=true;jazz.volume=.2;try{await jazz.play()}catch{musicEnabled=false}}else{jazz.pause()}});
byId('narration').addEventListener('click',()=>{narrationEnabled=!narrationEnabled;byId('narration').ariaPressed=String(narrationEnabled);byId('narration').textContent=narrationEnabled?'Narration on':'Narration off';if(narrationEnabled){audioStarted=true;byId('audioGate').hidden=true;speak(stages[index])}else{speechSynthesis.cancel();jazz.volume=musicEnabled ? .2 : 0}});
byId('popout').textContent=popout?'Back':'Pop out';
byId('popout').addEventListener('click',()=>{if(popout){window.close();setTimeout(()=>{if(history.length>1)history.back();else location.href='brainzbytes-contextweaver-overview.html'},80)}else window.open('brainzbytes-contextweaver-overview.html?popout=1','brainzbytes-overview','popup,width=1280,height=920,noopener')});
addEventListener('keydown',event=>{if(['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement?.tagName))return;if(event.key===' '){event.preventDefault();byId('playPause').click()}if(event.key==='ArrowLeft')byId('previous').click();if(event.key==='ArrowRight')byId('next').click();if(event.key==='Home')byId('reset').click();if(event.key.toLowerCase()==='m')byId('music').click();if(event.key.toLowerCase()==='n')byId('narration').click();if(event.key==='Escape'&&popout)byId('popout').click()});
addEventListener('pagehide',()=>{speechSynthesis.cancel();jazz.pause()});
render();
</script>
</body>
</html>
