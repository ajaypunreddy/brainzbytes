<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030A06">
<title>BrainzBytes × ContextWeaver | BrainzBytes</title>
<style>
:root{--bg:#030A06;--panel:#07110C;--surface:#0C1A12;--line:#1F5A35;--muted:#9AAF9E;--ink:#F4FFF5;--lime:#A8FF3E}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 12% 0,#17331f 0,transparent 32%),var(--bg)}button{font:inherit}
.player{width:min(1320px,100%);border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--panel);box-shadow:0 24px 80px #0009}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 17px;border-bottom:1px solid var(--line)}.topbar strong{font-size:13px}.topbar span{color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.canvas{position:relative;aspect-ratio:8/5;background:#020704;overflow:hidden}.canvas>img{display:block;width:100%;height:100%;object-fit:contain}
.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.focus{fill:#a8ff3e12;stroke:var(--lime);stroke-width:5;vector-effect:non-scaling-stroke;filter:url(#glow)}.route{fill:none;stroke:var(--lime);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:14 11;filter:url(#glow);animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-50}}.caption{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;min-height:108px;padding:16px 18px;border-top:1px solid var(--line);background:linear-gradient(135deg,var(--surface),var(--panel))}.caption-label{margin:0 0 5px;color:var(--lime);font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.caption h1{margin:0;font-size:clamp(17px,2vw,25px)}.caption p:last-child{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.45}
.audio-gate{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#050b0812,#050b08b8)}.audio-gate[hidden]{display:none}.audio-gate button{display:grid;gap:4px;min-width:210px;padding:14px 18px;border:1px solid var(--lime);border-radius:12px;background:#102c1d;color:var(--ink);font-weight:850;cursor:pointer}.audio-gate small{color:#b8cabd;font-size:10px}
.controls{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}.controls button{min-height:35px;padding:0 11px;border:1px solid #315b3b;border-radius:8px;background:#0c1810;color:#d4e4d7;font-size:10px;font-weight:800;cursor:pointer}.controls button:hover,.controls button:focus-visible{border-color:var(--lime);color:var(--ink);outline:none}.controls .primary{border-color:var(--lime);background:var(--lime);color:#061008}
.progress{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:0 18px 14px}.progress button{height:4px;padding:0;border:0;border-radius:99px;background:#244a2d;cursor:pointer}.progress button.active{background:var(--lime);box-shadow:0 0 12px #a8ff3e88}
body.embedded{padding:0}body.embedded .player{width:100%;border:0;border-radius:0;box-shadow:none}body.popout{padding:24px}
@media(max-width:760px){.caption{grid-template-columns:1fr}.controls{justify-content:flex-start}.controls button{flex:1 1 auto}.topbar span{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<main class="player" aria-label="BrainzBytes × ContextWeaver">
<header class="topbar"><strong>BrainzBytes × ContextWeaver</strong><span id="stageCount">01 / 10</span></header>
<section class="canvas"><img src="brainzbytes-contextweaver-overview.svg" alt="Three angled architectural planes show composition, execution, intelligence, and evidence."><svg class="overlay" viewBox="0 0 1600 1000" aria-hidden="true"><defs><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g id="focusLayer"></g><g id="routeLayer"></g></svg><div class="audio-gate" id="audioGate"><button type="button" id="beginStory">Begin the audio story<small>Original jazz + narrated overview</small></button></div></section>
<section class="caption" aria-live="polite"><div><p class="caption-label" id="stageLabel"></p><h1 id="stageTitle"></h1><p id="stageCaption"></p></div><div class="controls"><button id="previous">Previous</button><button id="playPause" class="primary">Pause</button><button id="next">Next</button><button id="reset">Reset</button><button id="music" aria-pressed="true">Music on</button><button id="narration" aria-pressed="true">Narration on</button><button id="popout">Pop out</button></div></section>
<nav class="progress" id="progress" aria-label="Animation stages"></nav><audio id="jazz" src="brainzbytes-jazz-loop.wav" loop preload="auto"></audio></main>
<script>
const stages=[{"label":"Governed intent","title":"Every system begins with explicit purpose.","caption":"Goals, constraints, tenant context, and identity enter as governed intent.","box":[157,198,256,148],"route":[]},{"label":"Governance","title":"Authority is evaluated before execution.","caption":"Policy, entitlements, guardrails, budgets, and evidence requirements bind the run.","box":[432,228,256,148],"route":[[385,273],[440,280]]},{"label":"Studio","title":"Builders compose approved capabilities.","caption":"Agents, MCP tools, knowledge, models, and APIs are assembled without rebuilding the platform.","box":[707,258,256,148],"route":[[660,303],[715,310]]},{"label":"Registry","title":"Only signed immutable releases may run.","caption":"Versioned definitions and evidence create a stable supply chain from authoring to production.","box":[982,288,256,148],"route":[[935,333],[990,340]]},{"label":"Orchestrator","title":"The orchestrator plans and reconciles durable work.","caption":"It resolves the graph, commits the plan, and coordinates recovery without granting itself authority.","box":[227,463,256,148],"route":[[1100,415],[1100,455],[345,455],[345,485]]},{"label":"Agents and MCP","title":"Bounded workers perform specialized actions.","caption":"Agents reason while MCP capabilities execute narrow, policy-scoped operations.","box":[502,493,256,148],"route":[[455,538],[510,545]]},{"label":"Event mesh","title":"Commands, retries, and compensation move durably.","caption":"The event mesh separates services while preserving correlation, leases, and replay.","box":[777,523,256,148],"route":[[730,568],[785,575]]},{"label":"Live services","title":"Approved compositions become scalable services.","caption":"Portable runtime contracts support deployment, replacement, and migration across Kubernetes platforms.","box":[1052,553,256,148],"route":[[1005,598],[1060,605]]},{"label":"Cerebros","title":"Cerebros understands context and intent.","caption":"The reasoning plane retrieves evidence, plans bounded work, and interprets outcomes.","box":[297,728,256,148],"route":[[1170,680],[1170,720],[415,720],[415,750]]},{"label":"Evidence","title":"Every material action returns proof.","caption":"Receipts, traces, approvals, audits, and replay complete the governed feedback loop.","box":[572,758,256,148],"route":[[525,803],[580,810]]}];const params=new URLSearchParams(location.search),embedded=params.get("embedded")==="1",popout=params.get("popout")==="1";document.body.classList.toggle("embedded",embedded);document.body.classList.toggle("popout",popout);
const byId=id=>document.getElementById(id),focusLayer=byId("focusLayer"),routeLayer=byId("routeLayer"),progress=byId("progress");let index=0,playing=true,timer=0;const jazz=byId("jazz");let audioStarted=false,musicEnabled=true,narrationEnabled=true;jazz.volume=.2;function speak(stage){speechSynthesis.cancel();if(!audioStarted||!narrationEnabled)return;const u=new SpeechSynthesisUtterance(stage.title+". "+stage.caption);u.rate=.96;u.pitch=.94;u.onstart=()=>{jazz.volume=musicEnabled?.07:0};u.onend=u.onerror=()=>{jazz.volume=musicEnabled?.2:0};speechSynthesis.speak(u)}
stages.forEach((s,i)=>{const b=document.createElement("button");b.type="button";b.ariaLabel=`Open stage ${i+1}: ${s.label}`;b.onclick=()=>{index=i;render()};progress.append(b)});
function node(name,attrs){const n=document.createElementNS("http://www.w3.org/2000/svg",name);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n}
function schedule(){clearTimeout(timer);if(playing)timer=setTimeout(()=>{index=(index+1)%stages.length;render()},4200)}
function render(announce=false){const s=stages[index];focusLayer.replaceChildren();routeLayer.replaceChildren();const [x,y,w,h]=s.box;focusLayer.append(node("rect",{x,y,width:w,height:h,rx:20,class:"focus"}));if(s.route.length){const d="M"+s.route.map(p=>p.join(" ")).join(" L");routeLayer.append(node("path",{d,class:"route"}))}byId("stageLabel").textContent=`${String(index+1).padStart(2,"0")} · ${s.label}`;byId("stageTitle").textContent=s.title;byId("stageCaption").textContent=s.caption;byId("stageCount").textContent=`${String(index+1).padStart(2,"0")} / ${String(stages.length).padStart(2,"0")}`;[...progress.children].forEach((b,i)=>b.classList.toggle("active",i===index));byId("playPause").textContent=playing?"Pause":"Play";if(announce)speak(s);schedule()}
byId("previous").onclick=()=>{index=(index-1+stages.length)%stages.length;render(true)};byId("next").onclick=()=>{index=(index+1)%stages.length;render(true)};byId("playPause").onclick=()=>{playing=!playing;render()};byId("reset").onclick=()=>{index=0;playing=false;render()};
byId("beginStory").onclick=async()=>{audioStarted=true;byId("audioGate").hidden=true;if(musicEnabled){try{await jazz.play()}catch{musicEnabled=false;byId("music").textContent="Music off"}}speak(stages[index])};byId("music").onclick=async()=>{musicEnabled=!musicEnabled;byId("music").ariaPressed=String(musicEnabled);byId("music").textContent=musicEnabled?"Music on":"Music off";if(musicEnabled){audioStarted=true;byId("audioGate").hidden=true;try{await jazz.play()}catch{musicEnabled=false}}else jazz.pause()};byId("narration").onclick=()=>{narrationEnabled=!narrationEnabled;byId("narration").ariaPressed=String(narrationEnabled);byId("narration").textContent=narrationEnabled?"Narration on":"Narration off";if(narrationEnabled){audioStarted=true;byId("audioGate").hidden=true;speak(stages[index])}else speechSynthesis.cancel()};addEventListener("pagehide",()=>{speechSynthesis.cancel();jazz.pause()});
byId("popout").textContent=popout?"Back":"Pop out";byId("popout").onclick=()=>{if(popout){window.close();setTimeout(()=>{if(history.length>1)history.back();else location.href="brainzbytes-contextweaver-overview.html"},80)}else window.open("brainzbytes-contextweaver-overview.html?popout=1","contextweaver-animation","popup,width=1380,height=960,noopener")};
addEventListener("keydown",e=>{if(["INPUT","TEXTAREA","BUTTON"].includes(document.activeElement?.tagName))return;if(e.key===" "){e.preventDefault();byId("playPause").click()}if(e.key==="ArrowLeft")byId("previous").click();if(e.key==="ArrowRight")byId("next").click();if(e.key==="Home")byId("reset").click();if(e.key==="Escape"&&popout)byId("popout").click()});render();
</script></body></html>
