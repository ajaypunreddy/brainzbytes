<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intent to Outcome — Presentation</title>
<style>
  :root { --bg:#06090a; --panel:#0d1412; --line:#1d3a2c; --lime:#7CFF4F; --text:#e8f2ec; --muted:#8fa69a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; overflow:hidden; }
  .app { display:grid; grid-template-rows:auto 1fr auto auto; height:100%; }
  header { display:flex; justify-content:space-between; align-items:center; padding:10px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; font-weight:600; }
  header h1 span { color:var(--lime); }
  .count { color:var(--muted); font-size:14px; }
  .stage { position:relative; display:flex; align-items:center; justify-content:center; padding:14px; min-height:0; }
  .stage img { position:absolute; max-height:calc(100% - 28px); max-width:calc(100% - 28px); border-radius:10px;
    box-shadow:0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.6); opacity:0; transform:scale(.985); transition:opacity .45s ease, transform .45s ease; }
  .stage img.on { opacity:1; transform:scale(1); }
  .nav { position:absolute; top:50%; transform:translateY(-50%); width:52px; height:52px; border-radius:50%;
    border:1px solid var(--line); background:rgba(13,20,18,.85); color:var(--lime); font-size:24px; cursor:pointer; z-index:2; }
  .nav:hover { border-color:var(--lime); }
  .prev { left:24px; } .next { right:24px; }
  .bar { height:4px; background:var(--panel); } .bar i { display:block; height:100%; background:var(--lime); transition:width .35s; }
  footer { display:flex; gap:8px; align-items:center; padding:10px 20px; border-top:1px solid var(--line); overflow-x:auto; }
  footer img { height:64px; border-radius:4px; opacity:.45; cursor:pointer; border:2px solid transparent; flex:none; }
  footer img.on { opacity:1; border-color:var(--lime); }
  .tools { margin-left:auto; display:flex; gap:8px; flex:none; }
  .tools button { background:var(--panel); color:var(--text); border:1px solid var(--line); padding:8px 12px; border-radius:6px; cursor:pointer; font:inherit; font-size:13px; }
  .tools button:hover { border-color:var(--lime); }
  :fullscreen header, :fullscreen footer { display:none; }
  @media (prefers-reduced-motion: reduce) { .stage img { transition:none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ContextWeaver &mdash; <span>Intent to Outcome</span></h1>
    <div style="display:flex;gap:14px;align-items:center"><a href="./" style="color:var(--lime);font-size:14px">Try the simulator &rarr;</a><div class="count" id="count">1 / 21</div></div>
  </header>
  <div class="stage" id="stage">
    <button class="nav prev" id="prev" aria-label="Previous slide">&#8249;</button>
    <button class="nav next" id="next" aria-label="Next slide">&#8250;</button>
  </div>
  <div class="bar"><i id="progress"></i></div>
  <footer id="thumbs">
    <div class="tools">
      <button id="play">Auto-play</button>
      <button id="fs">Full screen</button>
    </div>
  </footer>
</div>
<script>
  const N = 21, stage = document.getElementById('stage'), thumbs = document.getElementById('thumbs');
  const tools = thumbs.querySelector('.tools');
  const src = i => `slide-${String(i + 1).padStart(2, '0')}.png`;
  const slides = [], minis = [];
  for (let i = 0; i < N; i++) {
    const img = new Image(); img.src = src(i); img.alt = `Slide ${i + 1}`; stage.appendChild(img); slides.push(img);
    const t = new Image(); t.src = src(i); t.alt = `Go to slide ${i + 1}`; t.onclick = () => go(i);
    thumbs.insertBefore(t, tools); minis.push(t);
  }
  let cur = 0, timer = null;
  function go(i) {
    cur = (i + N) % N;
    slides.forEach((s, k) => s.classList.toggle('on', k === cur));
    minis.forEach((s, k) => s.classList.toggle('on', k === cur));
    minis[cur].scrollIntoView({ block: 'nearest', inline: 'center' });
    document.getElementById('count').textContent = `${cur + 1} / ${N}`;
    document.getElementById('progress').style.width = `${(cur + 1) / N * 100}%`;
    history.replaceState(null, '', `#${cur + 1}`);
  }
  function togglePlay() {
    const b = document.getElementById('play');
    if (timer) { clearInterval(timer); timer = null; b.textContent = 'Auto-play'; }
    else { timer = setInterval(() => go(cur + 1), 6000); b.textContent = 'Pause'; }
  }
  document.getElementById('prev').onclick = () => go(cur - 1);
  document.getElementById('next').onclick = () => go(cur + 1);
  document.getElementById('play').onclick = togglePlay;
  document.getElementById('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  document.addEventListener('keydown', e => {
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) go(cur - 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(N - 1);
    else if (e.key.toLowerCase() === 'f') document.getElementById('fs').click();
  });
  let x0 = null;
  stage.addEventListener('touchstart', e => x0 = e.touches[0].clientX);
  stage.addEventListener('touchend', e => { if (x0 === null) return; const d = e.changedTouches[0].clientX - x0; if (Math.abs(d) > 40) go(cur + (d < 0 ? 1 : -1)); x0 = null; });
  go(Math.max(0, Math.min(N - 1, (parseInt(location.hash.slice(1)) || 1) - 1)));
</script>
</body>
</html>
