  .diagram-subtitle { fill:#a8bbb3; font:12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node rect { fill:#10231e; stroke:#38544a; stroke-width:2; }
  .node-mint rect { stroke:#70e6b1; } .node-sky rect { stroke:#52b788; }
