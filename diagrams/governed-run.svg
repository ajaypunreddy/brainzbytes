    <g role="img" aria-labelledby="diagram-title diagram-desc">
      <title id="diagram-title">Solution Action to Governed Service Run</title>
      <desc id="diagram-desc">A user-facing Solution action resolves a reusable Service while identity, policy, data, Agents, MCP tools, approvals, durable state, and evidence remain explicit.</desc>
