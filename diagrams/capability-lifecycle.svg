      <text class="diagram-title" x="36" y="46">Agent and MCP Capability Lifecycle</text>
      <text class="diagram-subtitle" x="36" y="72">A capability becomes usable only after specification, conformance, supply-chain evidence, admission, deployment, attestation, qualification, and Registry convergence.</text>
      <g class="edges"><g id="edge-c1" class="edge edge-data" data-edge-id="c1"><path d="M 208.0 163.0 L 225.0 163.0 L 225.0 163.0 L 242.0 163.0" marker-end="url(#arrow)"/><text x="226.2" y="155.0">test</text></g><g id="edge-c2" class="edge edge-data" data-edge-id="c2"><path d="M 417.0 163.0 L 434.0 163.0 L 434.0 163.0 L 451.0 163.0" marker-end="url(#arrow)"/><text x="434.0" y="155.0">prove</text></g><g id="edge-c3" class="edge edge-governance" data-edge-id="c3"><path d="M 626.0 163.0 L 643.0 163.0 L 643.0 163.0 L 660.0 163.0" marker-end="url(#arrow)"/><text x="643.0" y="155.0">submit</text></g><g id="edge-c4" class="edge edge-governance" data-edge-id="c4"><path d="M 835.0 163.0 L 852.0 163.0 L 852.0 163.0 L 869.0 163.0" marker-end="url(#arrow)"/><text x="852.0" y="155.0">admit</text></g><g id="edge-c5" class="edge edge-success" data-edge-id="c5"><path d="M 956.5 214.0 L 956.5 266.0 L 1068.0 266.0 L 1068.0 318.0" marker-end="url(#arrow)"/><text x="1012.2" y="260.0">release</text></g><g id="edge-c6" class="edge edge-success" data-edge-id="c6"><path d="M 974.0 373.0 L 952.0 373.0 L 952.0 373.0 L 930.0 373.0" marker-end="url(#arrow)"/><text x="952.0" y="365.0">reconcile</text></g><g id="edge-c7" class="edge edge-data" data-edge-id="c7"><path d="M 742.0 373.0 L 720.0 373.0 L 720.0 373.0 L 698.0 373.0" marker-end="url(#arrow)"/><text x="720.0" y="365.0">discover</text></g><g id="edge-c8" class="edge edge-governance" data-edge-id="c8"><path d="M 510.0 373.0 L 488.0 373.0 L 488.0 373.0 L 466.0 373.0" marker-end="url(#arrow)"/><text x="488.0" y="365.0">verify</text></g><g id="edge-c9" class="edge edge-success" data-edge-id="c9"><path d="M 278.0 373.0 L 256.0 373.0 L 256.0 373.0 L 234.0 373.0" marker-end="url(#arrow)"/><text x="256.0" y="365.0">promote</text></g><g id="edge-c10" class="edge edge-data" data-edge-id="c10"><path d="M 234.0 373.0 L 314.0 373.0 L 314.0 596.0 L 394.0 596.0" marker-end="url(#arrow)"/><text x="370.0" y="476.5">resolve + observe</text></g><g id="edge-c11" class="edge edge-evidence" data-edge-id="c11"><path d="M 600.0 540.0 L 600.0 377.0 L 956.5 377.0 L 956.5 214.0" marker-end="url(#arrow)"/><text x="778.2" y="371.5">new version / lifecycle</text></g></g>
