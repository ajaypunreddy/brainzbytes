<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><style>
  .grid-lines path { stroke:#38544a; stroke-width:1; }
  .diagram-title { fill:#f4f8f2; font:700 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .diagram-subtitle { fill:#a8bbb3; font:12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node rect { fill:#10231e; stroke:#38544a; stroke-width:2; }
  .node-mint rect { stroke:#70e6b1; } .node-sky rect { stroke:#52b788; }
  .node-amber rect { stroke:#ffc76a; } .node-violet rect { stroke:#9bcf9f; }
  .node-coral rect { stroke:#7fb98d; }
  .node-title { fill:#f4f8f2; font:700 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor:middle; }
  .node-subtitle { fill:#a8bbb3; font:10px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor:middle; }
  .edge path { fill:none; stroke:#38544a; stroke-width:2.5; }
  .edge text { fill:#a8bbb3; font:9px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor:middle; paint-order:stroke; stroke:#07110f; stroke-width:4; }
  .edge-governance path { stroke:#9bcf9f; stroke-dasharray:8 6; }
  .edge-success path { stroke:#70e6b1; } .edge-evidence path { stroke:#ffc76a; stroke-dasharray:5 5; }
  .edge-waiting path { stroke:#ffc76a; stroke-dasharray:10 7; }
</style>
    <g role="img" aria-labelledby="diagram-title diagram-desc">
      <title id="diagram-title">Agent and MCP Capability Lifecycle</title>
      <desc id="diagram-desc">A capability becomes usable only after specification, conformance, supply-chain evidence, admission, deployment, attestation, qualification, and Registry convergence.</desc>
