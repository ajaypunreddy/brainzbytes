      <g class="edges"><g id="edge-f1" class="edge edge-data" data-edge-id="f1"><path d="M 216.0 200.0 L 238.0 200.0 L 238.0 200.0 L 260.0 200.0" marker-end="url(#arrow)"/><text x="240.5" y="192.0">ingest</text></g><g id="edge-f2" class="edge edge-data" data-edge-id="f2"><path d="M 450.0 200.0 L 472.0 200.0 L 472.0 200.0 L 494.0 200.0" marker-end="url(#arrow)"/><text x="469.5" y="192.0">generate + edit</text></g><g id="edge-f3" class="edge edge-governance" data-edge-id="f3"><path d="M 674.0 200.0 L 696.0 200.0 L 696.0 200.0 L 718.0 200.0" marker-end="url(#arrow)"/><text x="698.5" y="192.0">validate</text></g><g id="edge-f4" class="edge edge-governance" data-edge-id="f4"><path d="M 908.0 200.0 L 930.0 200.0 L 930.0 200.0 L 952.0 200.0" marker-end="url(#arrow)"/><text x="935.0" y="192.0">admit</text></g><g id="edge-f5" class="edge edge-success" data-edge-id="f5"><path d="M 952.0 200.0 L 619.5 200.0 L 619.5 410.0 L 287.0 410.0" marker-end="url(#arrow)"/><text x="620.8" y="297.0">approved release</text></g><g id="edge-f6" class="edge edge-data" data-edge-id="f6"><path d="M 287.0 410.0 L 312.0 410.0 L 312.0 410.0 L 337.0 410.0" marker-end="url(#arrow)"/><text x="312.0" y="402.0">live runtime</text></g><g id="edge-f7" class="edge edge-success" data-edge-id="f7"><path d="M 542.0 410.0 L 747.0 410.0 L 747.0 200.0 L 952.0 200.0" marker-end="url(#arrow)"/><text x="748.2" y="297.0">promote</text></g><g id="edge-f8" class="edge edge-data" data-edge-id="f8"><path d="M 952.0 200.0 L 874.5 200.0 L 874.5 410.0 L 797.0 410.0" marker-end="url(#arrow)"/><text x="875.8" y="297.0">discover</text></g><g id="edge-f9" class="edge edge-governance" data-edge-id="f9"><path d="M 797.0 410.0 L 822.0 410.0 L 822.0 410.0 L 847.0 410.0" marker-end="url(#arrow)"/><text x="822.0" y="402.0">immutable plan</text></g><g id="edge-f10" class="edge edge-success" data-edge-id="f10"><path d="M 847.0 410.0 L 780.5 410.0 L 780.5 604.0 L 714.0 604.0" marker-end="url(#arrow)"/><text x="774.8" y="499.0">finalize