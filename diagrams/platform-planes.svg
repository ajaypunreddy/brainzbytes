<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><style>
  .grid-lines path { stroke:#38544a; stroke-width:1; }
  .diagram-title { fill:#f4f8f2; font:700 24px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .diagram-subtitle { fill:#a8bbb3; font:12px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node rect { fill:#10231e; stroke:#38544a; stroke-width:2; }
  .node-mint rect { stroke:#70e6b1; } .node-sky rect { stroke:#52b788; }
  .node-amber rect { stroke:#ffc76a; } .node-violet rect { stroke:#9bcf9f; }
