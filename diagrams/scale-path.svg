      </g>
      <text class="diagram-title" x="36" y="46">Individual to Sovereign Enterprise</text>
      <text class="diagram-subtitle" x="36" y="72">The same Service, Workflow, Agent, and MCP contracts scale through progressively stronger sharing, isolation, governance, operations, and assurance.</text>
      <g class="edges"><g id="edge-s1" class="edge edge-data" data-edge-id="s1"><path d="M 227.0 202.5 L 250.5 202.5 L 250.5 202.5 L 274.0 202.5" marker-end="url(#arrow)"/><text x="250.5" y="194.5">share</text></g><g id="edge-s2" class="edge edge-data" data-edge-id="s2"><path d="M 459.0 202.5 L 482.5 202.5 L 482.5 202.5 L 506.0 202.5" marker-end="url(#arrow)"/><text x="482.5" y="194.5">standardize</text></g><g id="edge-s3" class="edge edge-data" data-edge-id="s3"><path d="M 691.0 202.5 L 714.5 202.5 L 714.5 202.5 L 738.0 202.5" marker-end="url(#arrow)"/><text x="714.5" y="194.5">govern</text></g><g id="edge-s4" class="edge edge-governance" data-edge-id="s4"><path d="M 923.0 202.5 L 946.5 202.5 L 946.5 202.5 L 970.0 202.5" marker-end="url(#arrow)"/><text x="946.5" y="194.5">isolate</text></g><g id="edge-s5" class="edge edge-data" data-edge-id="s5"><path d="M 134.5 260.0 L 134.5 324.0 L 276.0 324.0 L 276.0 388.0" marker-end="url(#arrow)"/><text x="205.2" y="314.2">same asset model</text></g><g id="edge-s6" class="edge edge-data" data-edge-id="s6"><path d="M 598.5 260.0 L 598.5 324.0 L 600.0 324.0 L 600.0 388.0" marker-end="url(#arrow)"/><text x="599.2" y="314.2">profile</text></g><g id="edge-s7" class="edge edge-governance" data-edge-id="s7"><path d="M 1062.5 260.0 L 1062.5 324.0 L 924.0 324.0 L 924.0 388.0" marker-end="url(#arrow)"/><text x="993.2" y="314.2">controls</text></g><g id="edge-s8" class="edge edge-success" data-edge-id="s8"><path d="M 426.0 442.0 L 393.0 442.0 L 393.0 615.0 L 360.0 615.0" marker-end="url(#arrow)"/><text x="438.0" y="520.5">preserve investment</text></g><g id="edge-s9" class="edge edge-success" data-edge-id="s9"><path d="M 600.0 496.0 L 600.0 533.0 L 600.0 533.0 L 600.0 570.0" marker-end="url(#arrow)"/><text x="600.0" y="520.5">scale operations</text></g><g id="edge-s10" class="edge edge-success" data-edge-id="s10"><path d="M 774.0 442.0 L 807.0 442.0 L 807.0 615.0 L 840.0 615.0" marker-end="url(#arrow)"/><text x="762.0" y="520.5">adapt domain</text></g></g>
