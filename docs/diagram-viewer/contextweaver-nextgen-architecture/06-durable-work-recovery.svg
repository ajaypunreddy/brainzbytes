<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#557d91"/></marker></defs><rect width="100%" height="100%" fill="#f7fbfc"/><polyline points="250.0,155.0 270.0,155.0 270.0,155.0 290.0,155.0" fill="none" stroke="#6c8ebf" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="500.0,155.0 520.0,155.0 520.0,155.0 540.0,155.0" fill="none" stroke="#82b366" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="730.0,155.0 750.0,155.0 750.0,155.0 770.0,155.0" fill="none" stroke="#d6b656" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="990.0,155.0 1010.0,155.0 1010.0,155.0 1030.0,155.0" fill="none" stroke="#9673a6" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="1220.0,155.0 1240.0,155.0 1240.0,155.0 1260.0,155.0" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="1260.0,155.0 1260.0,155.0 1260.0,305.0 1260.0,305.0" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrow)"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="1260.0" y="230.0">redeliver / reclaim</tspan></text><polyline points="1030.0,305.0 1010.0,305.0 1010.0,305.0 990.0,305.0" fill="none" stroke="#82b366" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="730.0,305.0 705.0,305.0 705.0,305.0 680.0,305.0" fill="none" stroke="#6c8ebf" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="430.0,305.0 405.0,305.0 405.0,305.0 380.0,305.0" fill="none" stroke="#d6b656" stroke-width="1.8" marker-end="url(#arrow)"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="640.0" y="40.0">ContextWeaver - Durable Cross-Pod Work Recovery</tspan></text><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.0" font-weight="normal" font-style="normal" fill="#5d7180"><tspan x="765.0" y="70.0">Kubernetes restores compute. PostgreSQL, RabbitMQ, leases, checkpoints, idempotency, and receipts restore accepted work.</tspan></text><rect x="60.0" y="120.0" width="190.0" height="70.0" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="155.0" y="147.5">1  Authorized request</tspan><tspan x="155.0" y="162.5">+ idempotency key</tspan></text><rect x="290.0" y="120.0" width="210.0" height="70.0" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="395.0" y="147.5">2  PostgreSQL transaction</tspan><tspan x="395.0" y="162.5">run + task + outbox</tspan></text><rect x="540.0" y="120.0" width="190.0" height="70.0" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="635.0" y="147.5">3  Confirmed outbox</tspan><tspan x="635.0" y="162.5">publisher</tspan></text><rect x="770.0" y="120.0" width="220.0" height="70.0" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="880.0" y="147.5">4  RabbitMQ quorum queue</tspan><tspan x="880.0" y="162.5">manual acknowledgement</tspan></text><rect x="1030.0" y="120.0" width="190.0" height="70.0" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="1125.0" y="147.5">5  Worker Pod A</tspan><tspan x="1125.0" y="162.5">lease + checkpoint</tspan></text><rect x="1260.0" y="120.0" width="210.0" height="70.0" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="1365.0" y="155.0">Pod / process / node fails</tspan></text><rect x="1030.0" y="270.0" width="230.0" height="70.0" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="1145.0" y="297.5">6  Worker Pod B claims</tspan><tspan x="1145.0" y="312.5">redelivery or expired lease</tspan></text><rect x="730.0" y="270.0" width="260.0" height="70.0" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="860.0" y="297.5">7  Load pinned plan, checkpoint,</tspan><tspan x="860.0" y="312.5">inbox, receipts, policy epochs</tspan></text><rect x="430.0" y="270.0" width="250.0" height="70.0" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="555.0" y="297.5">8  Resume or safely replay</tspan><tspan x="555.0" y="312.5">idempotent side effects</tspan></text><rect x="130.0" y="270.0" width="250.0" height="70.0" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="255.0" y="297.5">9  Commit result, receipt, audit,</tspan><tspan x="255.0" y="312.5">next outbox event</tspan></text><rect x="60.0" y="410.0" width="700.0" height="220.0" rx="2" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="410.0" y="520.0">Authoritative durable state</tspan></text><rect x="100.0" y="465.0" width="280.0" height="45.0" rx="10" fill="#edf4fc" stroke="#6c8ebf" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="240.0" y="487.5">Runs | tasks | attempts | dependencies</tspan></text><rect x="430.0" y="465.0" width="280.0" height="45.0" rx="10" fill="#edf4fc" stroke="#6c8ebf" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="570.0" y="487.5">Leases | heartbeats | timers | HITL</tspan></text><rect x="100.0" y="535.0" width="280.0" height="45.0" rx="10" fill="#edf4fc" stroke="#6c8ebf" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="240.0" y="557.5">Inbox | outbox | checkpoints</tspan></text><rect x="430.0" y="535.0" width="280.0" height="45.0" rx="10" fill="#edf4fc" stroke="#6c8ebf" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="570.0" y="557.5">Receipts | Saga | compensation</tspan></text><rect x="810.0" y="410.0" width="700.0" height="220.0" rx="2" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="1160.0" y="520.0">Kubernetes availability profile</tspan></text><rect x="850.0" y="465.0" width="280.0" height="45.0" rx="10" fill="#edf6ec" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="990.0" y="487.5">2+ replicas | topology spread | PDB</tspan></text><rect x="1180.0" y="465.0" width="280.0" height="45.0" rx="10" fill="#edf6ec" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="1320.0" y="487.5">maxUnavailable 0 | maxSurge 1</tspan></text><rect x="850.0" y="535.0" width="280.0" height="45.0" rx="10" fill="#edf6ec" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="990.0" y="557.5">startup | readiness | liveness</tspan></text><rect x="1180.0" y="535.0" width="280.0" height="45.0" rx="10" fill="#edf6ec" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="1320.0" y="557.5">graceful drain | HPA | KEDA</tspan></text><rect x="180.0" y="690.0" width="1240.0" height="58.0" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="800.0" y="719.0">Availability is not durability: replicas keep endpoints reachable; durable state and idempotent recovery prevent accepted work from being lost or applied twice.</tspan></text></svg>