<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 z" fill="#557d91"/></marker></defs><rect width="100%" height="100%" fill="#f7fbfc"/><polyline points="270.0,157.5 290.0,157.5 290.0,157.5 310.0,157.5" fill="none" stroke="#6c8ebf" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="530.0,157.5 550.0,157.5 550.0,157.5 570.0,157.5" fill="none" stroke="#6c8ebf" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="820.0,157.5 840.0,157.5 840.0,157.5 860.0,157.5" fill="none" stroke="#d6b656" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="1110.0,157.5 1130.0,157.5 1130.0,157.5 1150.0,157.5" fill="none" stroke="#d6b656" stroke-width="1.8" marker-end="url(#arrow)"/><polyline points="1150.0,157.5 1280.0,157.5 1280.0,415.0 1410.0,415.0" fill="none" stroke="#82b366" stroke-width="1.8" marker-end="url(#arrow)"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="1280.0" y="278.8">approved desired</tspan><tspan x="1280.0" y="293.8">state</tspan></text><polyline points="800.0,530.0 800.0,570.0 800.0,570.0 800.0,610.0" fill="none" stroke="#9673a6" stroke-width="1.8" marker-end="url(#arrow)"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="800.0" y="570.0">attest + discover</tspan></text><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="740.0" y="40.0">ContextWeaver - Dynamic Agent and MCP Admission, Deployment, and Discovery</tspan></text><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.0" font-weight="normal" font-style="normal" fill="#5d7180"><tspan x="790.0" y="70.0">Dynamic onboarding never means direct deployment: every package is validated, scanned, approved, reconciled by the Capability Operator, and verified by the Registry.</tspan></text><rect x="50.0" y="120.0" width="220.0" height="75.0" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="160.0" y="150.0">1  UI / API / Git submission</tspan><tspan x="160.0" y="165.0">AgentSpec or MCPSpec</tspan></text><rect x="310.0" y="120.0" width="220.0" height="75.0" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="420.0" y="150.0">2  Parse + normalize</tspan><tspan x="420.0" y="165.0">strict schemas + digest</tspan></text><rect x="570.0" y="110.0" width="250.0" height="95.0" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="695.0" y="142.5">3  Supply-chain scans</tspan><tspan x="695.0" y="157.5">signature | SBOM | CVE | malware |</tspan><tspan x="695.0" y="172.5">secrets</tspan></text><rect x="860.0" y="120.0" width="250.0" height="75.0" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="985.0" y="150.0">4  Security + quality + resilience</tspan><tspan x="985.0" y="165.0">evaluation</tspan></text><rect x="1150.0" y="120.0" width="250.0" height="75.0" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="1275.0" y="150.0">5  Risk approval</tspan><tspan x="1275.0" y="165.0">signed immutable release bundle</tspan></text><rect x="190.0" y="300.0" width="1220.0" height="230.0" rx="2" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="800.0" y="415.0">6  Capability Operator</tspan></text><rect x="235.0" y="355.0" width="250.0" height="50.0" rx="10" fill="#f3eef6" stroke="#9673a6" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="360.0" y="372.5">Reverify signatures, evidence,</tspan><tspan x="360.0" y="387.5">image and chart digests</tspan></text><rect x="525.0" y="355.0" width="240.0" height="50.0" rx="10" fill="#f3eef6" stroke="#9673a6" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="645.0" y="380.0">Render allowlisted Helm package</tspan></text><rect x="805.0" y="350.0" width="270.0" height="60.0" rx="10" fill="#f3eef6" stroke="#9673a6" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="940.0" y="372.5">Apply identity, queues, security,</tspan><tspan x="940.0" y="387.5">network, quota, PDB, HPA/KEDA</tspan></text><rect x="1115.0" y="355.0" width="250.0" height="50.0" rx="10" fill="#f3eef6" stroke="#9673a6" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="1240.0" y="372.5">Reconcile, status, drift, drain,</tspan><tspan x="1240.0" y="387.5">rollback, quarantine</tspan></text><rect x="450.0" y="440.0" width="300.0" height="55.0" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="600.0" y="460.0">Agent runtime namespace</tspan><tspan x="600.0" y="475.0">RabbitMQ + Model Gateway only</tspan></text><rect x="850.0" y="440.0" width="320.0" height="55.0" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="1010.0" y="460.0">MCP runtime namespace</tspan><tspan x="1010.0" y="475.0">RabbitMQ + approved connector domain</tspan></text><rect x="80.0" y="610.0" width="1440.0" height="190.0" rx="2" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="800.0" y="705.0">7  Runtime discovery</tspan></text><rect x="125.0" y="670.0" width="300.0" height="55.0" rx="10" fill="#edf6ec" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="275.0" y="690.0">Service descriptor + Agent Card / MCP</tspan><tspan x="275.0" y="705.0">capabilities + schemas</tspan></text><rect x="470.0" y="670.0" width="300.0" height="55.0" rx="10" fill="#edf6ec" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="620.0" y="690.0">Health + capacity + metrics + dashboards +</tspan><tspan x="620.0" y="705.0">alerts + runbook</tspan></text><rect x="815.0" y="670.0" width="280.0" height="55.0" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="955.0" y="690.0">Registry validation</tspan><tspan x="955.0" y="705.0">candidate lifecycle</tspan></text><rect x="1140.0" y="670.0" width="300.0" height="55.0" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="1290.0" y="690.0">Synthetic + canary evidence</tspan><tspan x="1290.0" y="705.0">logical alias promotion</tspan></text><rect x="180.0" y="860.0" width="1240.0" height="58.0" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="800.0" y="881.5">Only the Capability Operator deploys Agent/MCP runtime releases. Discovery registers capability and operations metadata, but activation still requires signed-bundle verification and</tspan><tspan x="800.0" y="896.5">healthy canary evidence.</tspan></text></svg>