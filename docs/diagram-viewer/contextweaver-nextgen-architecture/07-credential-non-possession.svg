nt-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="705.0" y="590.0">scoped call</tspan></text><polyline points="780.0,540.0 780.0,590.0 1000.0,590.0 1000.0,640.0" fill="none" stroke="#6c8ebf" stroke-width="1.8" marker-end="url(#arrow)"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="890.0" y="590.0">decision metadata</tspan></text><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="690.0" y="40.0">ContextWeaver - Credential Non-Possession and Delegated Authority</tspan></text><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.0" font-weight="normal" font-style="normal" fill="#5d7180"><tspan x="765.0" y="70.0">Agents receive constrained workload identity and opaque references; trusted gateways resolve short-lived credentials and never export them.</tspan></text><rect x="80.0" y="130.0" width="230.0" height="70.0" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="195.0" y="157.5">Human authentication</tspan><tspan x="195.0" y="172.5">server-side session</tspan></text><rect x="370.0" y="130.0" width="260.0" height="70.0" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="500.0" y="157.5">Identity + Entitlement + Policy</tspan><tspan x="500.0" y="172.5">delegation and consent</tspan></text><rect x="690.0" y="130.0" width="240.0" height="70.0" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="810.0" y="157.5">Immutable plan / message</tspan><tspan x="810.0" y="172.5">references only</tspan></text><rect x="990.0" y="105.0" width="260.0" height="120.0" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="1120.0" y="147.5">Agent sandbox</tspan><tspan x="1120.0" y="165.0">narrow workload identity</tspan><tspan x="1120.0" y="182.5">NO credential values</tspan></text><rect x="1320.0" y="130.0" width="210.0" height="70.0" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="1425.0" y="157.5">RabbitMQ</tspan><tspan x="1425.0" y="172.5">typed request / result</tspan></text><rect x="400.0" y="310.0" width="760.0" height="230.0" rx="2" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="780.0" y="425.0">Trusted enforcement gateways</tspan></text><rect x="445.0" y="365.0" width="300.0" height="48.0" rx="10" fill="#edf6ec" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="595.0" y="389.0">MCP / Connector Gateway</tspan></text><rect x="815.0" y="365.0" width="300.0" height="48.0" rx="10" fill="#edf6ec" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="965.0" y="389.0">Model Gateway</tspan></text><rect x="445.0" y="445.0" width="300.0" height="48.0" rx="10" fill="#edf6ec" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="595.0" y="469.0">Data / RAG Connector Gateway</tspan></text><rect x="815.0" y="445.0" width="300.0" height="48.0" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="965.0" y="469.0">Workload identity / OBO / token exchange</tspan></text><rect x="120.0" y="640.0" width="280.0" height="80.0" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="260.0" y="672.5">Secrets broker / cloud identity</tspan><tspan x="260.0" y="687.5">credential values stay here</tspan></text><rect x="490.0" y="640.0" width="280.0" height="80.0" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="630.0" y="672.5">Approved external resource</tspan><tspan x="630.0" y="687.5">exact audience + operation</tspan></text><rect x="860.0" y="640.0" width="280.0" height="80.0" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="1000.0" y="672.5">Privacy-safe audit evidence</tspan><tspan x="1000.0" y="687.5">references, decisions, expiry</tspan></text><rect x="1230.0" y="600.0" width="300.0" height="160.0" rx="10" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="1380.0" y="657.5">DENIED FROM AGENT</tspan><tspan x="1380.0" y="672.5">secret mounts | user tokens | provider keys</tspan><tspan x="1380.0" y="687.5">| Vault | metadata | database | object</tspan><tspan x="1380.0" y="702.5">store | MCP endpoints | public internet</tspan></text><rect x="180.0" y="820.0" width="1240.0" height="58.0" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="800.0" y="849.0">A credential reference is not authority. Resolution requires current workload identity, policy, delegation, consent, resource, audience, purpose, expiry, and revocation checks.</tspan></text></svg>