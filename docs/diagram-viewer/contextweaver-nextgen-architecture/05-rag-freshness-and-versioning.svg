ish, and Roll Back</tspan></text><rect x="140.0" y="533.0" width="330.0" height="42.0" rx="10" fill="#edf6ec" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="305.0" y="546.5">Security + lineage + quality + ACL +</tspan><tspan x="305.0" y="561.5">compatibility gate</tspan></text><rect x="540.0" y="533.0" width="280.0" height="42.0" rx="10" fill="#edf6ec" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="680.0" y="554.0">Atomic logical-alias promotion</tspan></text><rect x="890.0" y="533.0" width="240.0" height="42.0" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="1010.0" y="554.0">Active generation N+1</tspan></text><rect x="1200.0" y="528.0" width="260.0" height="52.0" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.0" font-weight="normal" font-style="normal" fill="#183746"><tspan x="1330.0" y="546.5">Generation N retained</tspan><tspan x="1330.0" y="561.5">bounded rollback window</tspan></text><rect x="40.0" y="620.0" width="1500.0" height="115.0" rx="2" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/><text text-anchor="middle" dominant-baseline="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.0" font-weight="bold" font-style="normal" fill="#183746"><tspan x="790.0" y="677.5">5  Authorization-First Retrieval</tspan></text><rect x="140.0" y="663.0" width="280.0" height="52.0" rx="10" fill="#f3ee