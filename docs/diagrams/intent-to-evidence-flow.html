<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Intent to Governed Evidence | BrainzBytes</title>
  <style>
    :root{color-scheme:dark;--bg:#071019;--panel:#0d1822;--text:#f8fafc;--muted:#9fb0bd;--aqua:#6ee7cf;--blue:#58a6ff;--amber:#fbbf24;--violet:#bc8cff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 5%,rgba(88,166,255,.15),transparent 30%),var(--bg);color:var(--text);font-family:Inter,Segoe UI,sans-serif}
    main{width:min(1240px,calc(100% - 24px));margin:24px auto}.head{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:16px}.head h1{margin:0;font-size:clamp(1.5rem,3vw,2.4rem)}.head p{margin:.4rem 0 0;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:7px}.controls button{padding:8px 12px;border:1px solid #2c4252;border-radius:9px;color:var(--text);background:#13212d;cursor:pointer}.controls button:hover{border-color:var(--aqua)}
    .stage{overflow:auto;border:1px solid #263846;border-radius:22px;background:linear-gradient(145deg,#0f1d28,#09121a);box-shadow:0 30px 90px rgba(0,0,0,.35)}svg{display:block;min-width:1040px;width:100%;height:auto}.node{transition:opacity .25s,filter .25s,transform .25s;transform-box:fill-box;transform-origin:center}.node:not(.active){opacity:.42}.node.active{filter:drop-shadow(0 0 12px rgba(110,231,207,.8));transform:translateY(-4px)}.edge{opacity:.2}.edge.active{opacity:1;stroke-dasharray:10 8;animation:flow 1s linear infinite}.caption{margin-top:12px;padding:15px 18px;border:1px solid #243847;border-radius:14px;color:#dce8ef;background:rgba(13,24,34,.92)}.caption b{color:var(--aqua)}
    @keyframes flow{to{stroke-dashoffset:-18}}@media(prefers-reduced-motion:reduce){.node{transition:none}.edge.active{animation:none}}@media(max-width:700px){.head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main>
  <div class="head"><div><h1>Intent to governed evidence</h1><p>See how ContextWeaver turns one request into authorized, durable, verifiable work.</p></div><div class="controls"><button id="prev">Previous</button><button id="play">Pause</button><button id="next">Next</button><button id="reset">Reset</button></div></div>
  <div class="stage">
    <svg viewBox="0 0 1200 390" role="img" aria-labelledby="diagramTitle diagramDesc">
      <title id="diagramTitle">ContextWeaver animated request flow</title><desc id="diagramDesc">Seven stages from intent through service resolution, authorization, durable commit, execution, verification, and delivery.</desc>
      <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#6ee7cf"/></marker><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08131c"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
      <rect width="1200" height="390" rx="24" fill="url(#b)"/>
      <text x="48" y="55" fill="#f8fafc" font-size="26" font-weight="800">Intent to governed evidence</text><text x="48" y="82" fill="#94a3b8" font-size="13">The active stage and connector explain what the platform is doing now.</text>
      <g fill="none" stroke="#6ee7cf" stroke-width="4" marker-end="url(#arr)"><path class="edge" data-edge="1" d="M184 188H213"/><path class="edge" data-edge="2" d="M349 188H378"/><path class="edge" data-edge="3" d="M514 188H543"/><path class="edge" data-edge="4" d="M679 188H708"/><path class="edge" data-edge="5" d="M844 188H873"/><path class="edge" data-edge="6" d="M1009 188H1038"/></g>
      <g text-anchor="middle" font-family="Inter,Segoe UI,sans-serif">
        <g class="node active" data-node="0"><rect x="48" y="132" width="136" height="112" rx="16" fill="#102a43" stroke="#58a6ff"/><text x="116" y="172" fill="#7dd3fc" font-size="12" font-weight="800">1 · INTENT</text><text x="116" y="202" fill="#fff" font-size="15" font-weight="700">User or API</text><text x="116" y="224" fill="#94a3b8" font-size="11">Request + purpose</text></g>
        <g class="node" data-node="1"><rect x="213" y="132" width="136" height="112" rx="16" fill="#10291f" stroke="#34d399"/><text x="281" y="172" fill="#6ee7cf" font-size="12" font-weight="800">2 · RESOLVE</text><text x="281" y="202" fill="#fff" font-size="15" font-weight="700">Service</text><text x="281" y="224" fill="#94a3b8" font-size="11">Workflow version</text></g>
        <g class="node" data-node="2"><rect x="378" y="132" width="136" height="112" rx="16" fill="#302510" stroke="#fbbf24"/><text x="446" y="172" fill="#fde68a" font-size="12" font-weight="800">3 · AUTHORIZE</text><text x="446" y="202" fill="#fff" font-size="15" font-weight="700">Whole graph</text><text x="446" y="224" fill="#94a3b8" font-size="11">Identity + policy</text></g>
        <g class="node" data-node="3"><rect x="543" y="132" width="136" height="112" rx="16" fill="#261b38" stroke="#bc8cff"/><text x="611" y="172" fill="#c4b5fd" font-size="12" font-weight="800">4 · COMMIT</text><text x="611" y="202" fill="#fff" font-size="15" font-weight="700">Durable truth</text><text x="611" y="224" fill="#94a3b8" font-size="11">Plan + outbox</text></g>
        <g class="node" data-node="4"><rect x="708" y="132" width="136" height="112" rx="16" fill="#102a43" stroke="#58a6ff"/><text x="776" y="172" fill="#7dd3fc" font-size="12" font-weight="800">5 · EXECUTE</text><text x="776" y="202" fill="#fff" font-size="15" font-weight="700">Workers</text><text x="776" y="224" fill="#94a3b8" font-size="11">Agent + MCP + RAG</text></g>
        <g class="node" data-node="5"><rect x="873" y="132" width="136" height="112" rx="16" fill="#302510" stroke="#fbbf24"/><text x="941" y="172" fill="#fde68a" font-size="12" font-weight="800">6 · VERIFY</text><text x="941" y="202" fill="#fff" font-size="15" font-weight="700">Approval</text><text x="941" y="224" fill="#94a3b8" font-size="11">Contracts + receipts</text></g>
        <g class="node" data-node="6"><rect x="1038" y="132" width="114" height="112" rx="16" fill="#10291f" stroke="#34d399"/><text x="1095" y="172" fill="#6ee7cf" font-size="12" font-weight="800">7 · DELIVER</text><text x="1095" y="202" fill="#fff" font-size="15" font-weight="700">Result</text><text x="1095" y="224" fill="#94a3b8" font-size="11">Evidence + replay</text></g>
      </g>
      <rect x="190" y="302" width="820" height="50" rx="14" fill="#0d1c27" stroke="#6ee7cf" stroke-dasharray="6 5"/><text x="600" y="333" fill="#c7f9ec" text-anchor="middle" font-size="13" font-weight="700">Policy · identity · durable state · audit · telemetry</text>
    </svg>
  </div>
  <div class="caption" id="caption" aria-live="polite"></div>
</main>
<script>
const stages=[
["Intent enters","A user or API submits an authenticated request with purpose, tenant context, and an idempotency key."],
["Resolve the contract","Intent selects a published Service and the exact immutable Workflow version that can satisfy it."],
["Authorize the whole graph","Identity, entitlements, Agents, MCP tools, models, data, budgets, and fallbacks are checked before admission."],
["Commit durable truth","The run, immutable plan, initial task, and outbox event commit together before the request returns 202 Accepted."],
["Execute bounded work","Durable queues dispatch leased attempts to Agent, MCP, RAG, approval, and transformation workers."],
["Verify before release","Contracts, citations, human decisions, policy receipts, and side effects are checked before finalization."],
["Deliver evidence","The canonical result, evidence, receipts, metrics, logs, traces, and replayable events remain available for review."]
];let current=0,playing=true,timer;const nodes=[...document.querySelectorAll(".node")],edges=[...document.querySelectorAll(".edge")],caption=document.querySelector("#caption"),play=document.querySelector("#play");
function show(index){current=(index+stages.length)%stages.length;nodes.forEach((n,i)=>n.classList.toggle("active",i===current));edges.forEach((e,i)=>e.classList.toggle("active",i===current-1));caption.innerHTML="<b>"+(current+1)+". "+stages[current][0]+"</b> — "+stages[current][1]}
function schedule(){clearInterval(timer);if(playing)timer=setInterval(()=>show(current+1),2600)}
document.querySelector("#prev").onclick=()=>{show(current-1);schedule()};document.querySelector("#next").onclick=()=>{show(current+1);schedule()};document.querySelector("#reset").onclick=()=>{show(0);schedule()};play.onclick=()=>{playing=!playing;play.textContent=playing?"Pause":"Play";schedule()};show(0);schedule();
</script>
</body>
</html>
